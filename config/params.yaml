fuels:
  HFO:
    name: "Heavy Fuel Oil (HFO)"
    is_conventional: true
    lhv_mj_kg: 40.2                     # Lower Heating Value (MJ/kg)
    engine_efficiency_ratio: 1.0        # Thermal efficiency relative to baseline 2-stroke diesel
    ef_tank_to_wake: 3.114              # Tank-to-Wake CO2e per tonne fuel (IMO standard proxy)
    ef_well_to_tank:
      default: 0.58                     # Extraction, refining, logistics
    price_usd_per_tonne:
      default: 550.0
    capacity_penalty_pct: 0.0           # Baseline tank volume
    slip_factor_co2e_per_tonne: 0.0     # Unburned hydrocarbon slip penalty
    pathways: ["fossil"]
    default_pathway: "fossil"

  MGO:
    name: "Marine Gas Oil (MGO)"
    is_conventional: true
    lhv_mj_kg: 42.7
    engine_efficiency_ratio: 1.0
    ef_tank_to_wake: 3.206
    ef_well_to_tank:
      default: 0.65
    price_usd_per_tonne:
      default: 780.0
    capacity_penalty_pct: 0.0
    slip_factor_co2e_per_tonne: 0.0
    pathways: ["fossil"]
    default_pathway: "fossil"

  LNG:
    name: "Liquefied Natural Gas (LNG)"
    is_conventional: false
    lhv_mj_kg: 48.0
    engine_efficiency_ratio: 1.03       # Lean burn Otto cycle thermal efficiency
    ef_tank_to_wake: 2.750
    ef_well_to_tank:
      default: 0.82
    price_usd_per_tonne:
      default: 720.0
    capacity_penalty_pct: 3.0           # Cryogenic tank space loss
    slip_factor_co2e_per_tonne: 0.15    # Methane slip in CO2e equivalent
    pathways: ["fossil"]
    default_pathway: "fossil"

  Methanol:
    name: "Methanol (CH3OH)"
    is_conventional: false
    lhv_mj_kg: 19.9
    engine_efficiency_ratio: 1.02
    ef_tank_to_wake: 1.375
    ef_well_to_tank:
      grey: 2.10                        # Natural gas steam reforming
      blue: 0.85                        # With carbon capture & storage
      green: 0.15                       # Biogenic or renewable e-methanol
    price_usd_per_tonne:
      grey: 480.0
      blue: 750.0
      green: 980.0
    capacity_penalty_pct: 5.0           # Lower energy density requires larger bunkering tanks
    slip_factor_co2e_per_tonne: 0.0
    pathways: ["grey", "blue", "green"]
    default_pathway: "green"

  Ammonia:
    name: "Ammonia (NH3)"
    is_conventional: false
    lhv_mj_kg: 18.6
    engine_efficiency_ratio: 0.98
    ef_tank_to_wake: 0.0                # Zero carbon tailpipe
    ef_well_to_tank:
      grey: 2.60                        # Haber-Bosch via fossil gas
      blue: 0.95                        # Blue Haber-Bosch with CCS
      green: 0.10                       # Green hydrogen Haber-Bosch
    price_usd_per_tonne:
      grey: 520.0
      blue: 790.0
      green: 1100.0
    capacity_penalty_pct: 9.0           # Pressurized/refrigerated storage penalty
    slip_factor_co2e_per_tonne: 0.18    # N2O combustion slip penalty
    pathways: ["grey", "blue", "green"]
    default_pathway: "green"

  Hydrogen:
    name: "Liquid Hydrogen (LH2)"
    is_conventional: false
    lhv_mj_kg: 120.0
    engine_efficiency_ratio: 1.15       # High efficiency PEM/SOFC or dual-fuel ICE
    ef_tank_to_wake: 0.0                # Zero tailpipe emissions
    ef_well_to_tank:
      grey: 11.50                       # Steam methane reforming
      blue: 3.20                        # Blue SMR + CCS
      green: 0.50                       # Electrolysis via renewable electricity
    price_usd_per_tonne:
      grey: 3200.0
      blue: 4800.0
      green: 6500.0
    capacity_penalty_pct: 14.0          # Vacuum-insulated cryogenic insulation loss
    slip_factor_co2e_per_tonne: 0.0
    pathways: ["grey", "blue", "green"]
    default_pathway: "green"

